<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCPP — HSE Control</title>
<meta name="description" content="Application de gestion des risques et anomalies HSE — SCPP">
<meta name="theme-color" content="#022562">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141c;
    --panel:#181b26;
    --panel-2:#1e222f;
    --card:#161923;
    --steel:#3a3f52;
    --border:#2a2e3c;
    --indigo:#022562;
    --indigo-light:#3c5aa6;
    --yellow:#FBC204;
    --yellow-dim:#5c4a12;
    --orange:#E8590C;
    --orange-dim:#4a2712;
    --red:#D62828;
    --red-dim:#4a1414;
    --green:#2F9E44;
    --green-dim:#1c3a24;
    --paper:#ECEDEE;
    --muted:#9AA1B2;
    --muted-2:#6b7185;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 0;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding:0 20px 20px 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:14px;
  }
  .brand-row{display:flex;align-items:center;gap:10px;}
  .brand-icon{
    width:38px;height:38px;border-radius:9px;object-fit:cover;
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 4px 10px rgba(0,0,0,.35);
    flex-shrink:0;image-rendering:auto;
  }
  .brand-word{
    font-family:'Oswald',sans-serif;font-size:23px;font-weight:700;letter-spacing:.05em;
    line-height:1;
  }
  .brand-word .w-indigo{color:var(--indigo-light);}
  .brand-word .w-yellow{color:var(--yellow);}
  .brand .sub{
    font-size:11px;color:var(--muted);margin-top:10px;letter-spacing:.06em;text-transform:uppercase;
  }
  .company-input{
    width:100%;margin-top:10px;background:var(--panel-2);border:1px solid var(--border);
    color:var(--paper);padding:6px 8px;border-radius:3px;font-size:12px;font-family:'Inter',sans-serif;
  }
  nav.navlist{display:flex;flex-direction:column;gap:2px;padding:0 10px;}
  .navitem{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:4px;cursor:pointer;
    color:var(--muted);font-size:13px;font-weight:500;
    border-left:3px solid transparent;
    transition:background .15s;
  }
  .navitem svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
  .navitem:hover{background:var(--panel-2);color:var(--paper);}
  .navitem.active{
    background:var(--panel-2);color:var(--yellow);border-left:3px solid var(--yellow);
  }
  .navitem.active svg{opacity:1;}
  .nav-footer{margin-top:auto;padding:14px 20px 0 20px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted-2);line-height:1.5;}

  /* ---------- Main ---------- */
  main{flex:1;padding:32px 40px;max-width:1200px;}
  .page-head{margin-bottom:26px;}
  .page-head h1{font-size:26px;color:var(--paper);}
  .page-head p{color:var(--muted);font-size:13.5px;margin-top:6px;max-width:640px;line-height:1.5;}

  .grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .kpi{
    background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px 18px;
    position:relative;overflow:hidden;
  }
  .kpi::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--steel);
  }
  .kpi.crit::before{background:var(--red);}
  .kpi.warn::before{background:var(--orange);}
  .kpi.ok::before{background:var(--green);}
  .kpi .val{font-family:'Oswald',sans-serif;font-size:32px;color:var(--paper);line-height:1;}
  .kpi .lbl{color:var(--muted);font-size:11.5px;margin-top:8px;text-transform:uppercase;letter-spacing:.05em;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:18px;}
  .card h2{font-size:15px;color:var(--paper);margin-bottom:14px;letter-spacing:.04em;}
  .card h3{font-size:13px;color:var(--muted);margin-bottom:10px;text-transform:none;letter-spacing:0;font-family:'Inter';font-weight:600;}

  /* Tag badges — signature element referencing physical scaffold inspection tags */
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px 4px 14px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
    clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);
    color:#161616;white-space:nowrap;
  }
  .tag::before{content:'';width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.35);}
  .tag.sev-mineur{background:var(--yellow);}
  .tag.sev-majeur{background:var(--orange);color:#fff;}
  .tag.sev-critique{background:var(--red);color:#fff;}
  .tag.st-ouvert{background:var(--steel);color:#fff;}
  .tag.st-encours{background:#4d6b8a;color:#fff;}
  .tag.st-cloture{background:var(--green);color:#fff;}

  /* Buttons & forms */
  .btn{
    background:var(--yellow);color:#181a1c;border:none;border-radius:4px;
    padding:10px 18px;font-weight:600;font-size:13px;cursor:pointer;
    font-family:'Inter',sans-serif;letter-spacing:.02em;
  }
  .btn:hover{background:#ffc933;}
  .btn.secondary{background:transparent;border:1px solid var(--border);color:var(--paper);}
  .btn.secondary:hover{border-color:var(--muted);}
  .btn.danger{background:var(--red);color:#fff;}
  .btn.small{padding:6px 12px;font-size:11.5px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  input[type=text],input[type=date],input[type=time],textarea,select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--paper);
    padding:9px 10px;border-radius:4px;font-size:13.5px;font-family:'Inter',sans-serif;
  }
  textarea{resize:vertical;min-height:70px;}
  .field{margin-bottom:14px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .checklist-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--yellow);flex-shrink:0;}
  .checklist-item .txt{font-size:13px;flex:1;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:hover td{background:var(--panel-2);}
  .empty-state{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;}
  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .filters select{width:auto;min-width:140px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .lbl{width:130px;font-size:12px;color:var(--muted);flex-shrink:0;}
  .bar-track{flex:1;background:var(--panel-2);border-radius:3px;height:18px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;}
  .bar-row .cnt{width:28px;text-align:right;font-family:'IBM Plex Mono';font-size:12px;color:var(--paper);}

  .risk-activity{border-left:3px solid var(--yellow);padding-left:16px;margin-bottom:22px;}
  .risk-activity h3{color:var(--paper);font-family:'Oswald';text-transform:uppercase;font-size:15px;letter-spacing:.03em;margin-bottom:10px;}
  .risk-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .risk-cols .col-h{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .risk-cols ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.7;color:var(--paper);}

  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;
    padding:12px 18px;border-radius:5px;font-size:13px;font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:999;
  }
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:500;overflow:auto;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;max-width:520px;width:100%;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
  .close-x{position:absolute;top:16px;right:20px;cursor:pointer;color:var(--muted);font-size:20px;background:none;border:none;}
  .anomaly-card{position:relative;}
  .desc-preview{color:var(--muted);font-size:12.5px;line-height:1.5;max-width:280px;}
  .meta-line{color:var(--muted-2);font-size:11px;margin-top:3px;}
  .divider{border:none;border-top:1px solid var(--border);margin:18px 0;}
  .hint{font-size:11px;color:var(--muted-2);margin-top:4px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  // -------------------- State --------------------

  const SEVERITIES = ['Mineur','Majeur','Critique'];
  const STATUSES = ['Ouvert','En cours','Clôturé'];

  const ROUND_CHECKLIST = [
    'Port des EPI adaptés à la tâche',
    'Garde-corps / protections en hauteur en place',
    'Balisage des zones à risque',
    'Propreté et rangement de la zone',

  const EPI_OPTIONS = [
    'Casque de sécurité','Chaussures de sécurité','Gants adaptés','Lunettes / écran facial',
    'Harnais antichute + longe','Masque respiratoire','Protection auditive',
    'Tenue haute visibilité','Tablier / manchettes (soudage)',
  ];

  const RISK_REGISTER = [
    {
      activity:'Échafaudage',
      hazards:['Chute de hauteur','Chute d\'objets','Effondrement / instabilité','Écrasement lors du montage'],
      epi:['Casque avec jugulaire','Harnais antichute + longe','Chaussures de sécurité','Gants'],
      controls:['Vérification de la stabilité et du calage avant usage','Garde-corps et plinthes à chaque niveau','Accès par échelle intérieure sécurisée','Contrôle par personne compétente (tag de conformité)','Interdiction d\'utilisation si tag non conforme'],

    {

    {

      controls:['Réglage du poste de travail (écran, siège, clavier)','Pauses régulières lors de tâches répétitives','Rangement des câbles et cheminements dédiés','Éclairage adapté au poste'],

  // -------------------- Storage helpers (localStorage — works standalone, per device/browser) --------------------
  async function loadKey(key){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }
  async function saveKey(key, value){
    try{
      localStorage.setItem(key, JSON.stringify(value));
    }catch(e){
      console.error('Storage error', e);
      showToast('Erreur de sauvegarde — réessayez.', true);
    }
  }

  async function init(){
    state.anomalies = await loadKey('hse:anomalies');
    state.rounds = await loadKey('hse:rounds');
    state.permits = await loadKey('hse:permits');
    state.loading = false;
    render();
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function nowTime(){ return new Date().toTimeString().slice(0,5); }
  function fmtDate(d){ if(!d) return '—'; const p = d.split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : d; }

  function showToast(msg, isError){
    state.toast = {msg, isError};
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 2500);
  }

  // -------------------- Icons --------------------
  const ICONS = {
    dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',

      case 'permits': return permitsView();

  function escapeHtml(s){
    if(s===undefined||s===null) return '';
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Stats ----------
  function statsView(){
    const total = state.anomalies.length;
    function countBy(arr, key){
      const m={};
      arr.forEach(a=>{ m[a[key]] = (m[a[key]]||0)+1; });
      return m;
    }
    const byActivity = countBy(state.anomalies,'activity');
    const bySeverity = countBy(state.anomalies,'severity');
    const byStatus = countBy(state.anomalies,'status');
    const colors = {Mineur:'var(--yellow)',Majeur:'var(--orange)',Critique:'var(--red)',Ouvert:'var(--steel)','En cours':'#4d6b8a',Clôturé:'var(--green)'};

    function barBlock(title, data){
      const max = Math.max(1,...Object.values(data));
      const keys = Object.keys(data);
      if(!keys.length) return `<div class="empty-state" style="padding:14px;">Pas encore de données.</div>`;
      return keys.map(k=>`
        <div class="bar-row">
          <div class="lbl">${k}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(data[k]/max*100)}%;background:${colors[k]||'var(--yellow)'};"></div></div>
          <div class="cnt">${data[k]}</div>
        </div>
      `).join('');
    }

    return `
      <div class="page-head">
        <h1>Statistiques</h1>
        <p>${total} anomalie(s) enregistrée(s) au total.</p>
      </div>
      <div class="card"><h2>Par activité</h2>${barBlock('activité', byActivity)}</div>
      <div class="card"><h2>Par gravité</h2>${barBlock('gravité', bySeverity)}</div>
      <div class="card"><h2>Par statut</h2>${barBlock('statut', byStatus)}</div>
    `;
  }

  // -------------------- Events --------------------
  function bindEvents(){
    document.querySelectorAll('[data-nav]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.view = el.getAttribute('data-nav'); state.modal=null; render(); });
    });

    const companyInput = document.getElementById('company-input');
    if(companyInput){
      companyInput.addEventListener('change', async (e)=>{
        state.company = e.target.value;
        await saveKey('hse:company', state.company);
      });
    }

    // New anomaly form
    const activitySelect = document.getElementById('activity-select');
    const typeSelect = document.getElementById('type-select');
    if(activitySelect && typeSelect){
      activitySelect.addEventListener('change', ()=>{
        const opts = TYPES_BY_ACTIVITY[activitySelect.value] || [];
        typeSelect.innerHTML = opts.map(t=>`<option value="${t}">${t}</option>`).join('') + `<option value="__autre__">Autre (préciser dans la description)</option>`;
      });
    }
    const anomalyForm = document.getElementById('anomaly-form');
    if(anomalyForm){
      anomalyForm.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(anomalyForm);
        const typeVal = fd.get('type');
        const anomaly = {
          id: uid(),
          createdAt: new Date().toISOString(),
          date: fd.get('date'),
          time: fd.get('time'),
          zone: fd.get('zone'),
          activity: fd.get('activity'),
          type: typeVal==='__autre__' ? 'Autre' : typeVal,
          description: fd.get('description'),
          correctiveAction: fd.get('correctiveAction'),
          severity: fd.get('severity'),
          responsible: fd.get('responsible'),
          dueDate: fd.get('dueDate'),
          reportedBy: fd.get('reportedBy'),
          status: 'Ouvert',
          closedAt: null,
        };
        state.anomalies.push(anomaly);
        await saveKey('hse:anomalies', state.anomalies);
        showToast('Fiche d\'anomalie enregistrée.');
        state.view = 'anomalies';
        render();
      });
    }

    // Filters
    ['filter-activity','filter-status','filter-severity'].forEach(id=>{
      const el = document.getElementById(id);
      if(el){
        el.addEventListener('change', ()=>{
          state._filters = state._filters || {activity:'',status:'',severity:''};
          if(id==='filter-activity') state._filters.activity = el.value;
          if(id==='filter-status') state._filters.status = el.value;
          if(id==='filter-severity') state._filters.severity = el.value;
          render();
        });
      }
    });

    document.querySelectorAll('[data-open-anomaly]').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.modal = {type:'anomaly', id: el.getAttribute('data-open-anomaly')};
        render();
      });
    });
    document.querySelectorAll('[data-close-modal]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.modal=null; render(); });
    });
    document.querySelectorAll('[data-save-status]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const id = el.getAttribute('data-save-status');
        const sel = document.getElementById('status-update-select');
        const a = state.anomalies.find(x=>x.id===id);
        if(a && sel){
          a.status = sel.value;
          if(sel.value==='Clôturé') a.closedAt = new Date().toISOString();
          await saveKey('hse:anomalies', state.anomalies);
          showToast('Statut mis à jour.');
        }
        state.modal = null;
        render();
      });
    });

    // Round form
    const roundForm = document.getElementById('round-form');
    if(roundForm){
      roundForm.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(roundForm);
        const items = ROUND_CHECKLIST.map((label,i)=>({label, ok: fd.get('chk_'+i)==='on'}));
        const round = {
          id: uid(), createdAt: new Date().toISOString(),
          date: fd.get('date'), zone: fd.get('zone'), inspector: fd.get('inspector'),
          items, observations: fd.get('observations'),
        };
        state.rounds.push(round);
        await saveKey('hse:rounds', state.rounds);
        showToast('Ronde de sécurité enregistrée.');
        render();
      });
    }

    // Permit form
    const permitForm = document.getElementById('permit-form');
    if(permitForm){
      permitForm.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(permitForm);
        const epi = EPI_OPTIONS.map((label,i)=>({label, checked: fd.get('epi_'+i)==='on'}));
        const permit = {
          id: uid(), createdAt: new Date().toISOString(),
          date: fd.get('date'), activity: fd.get('activity'), zone: fd.get('zone'),
          workers: fd.get('workers'), epi, hseVerified:false, status:'Actif',
        };
        state.permits.push(permit);
        await saveKey('hse:permits', state.permits);
        showToast('Permis de travail créé.');
        render();
      });
    }
    document.querySelectorAll('[data-verify-permit]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const id = el.getAttribute('data-verify-permit');
        const p = state.permits.find(x=>x.id===id);
        if(p){ p.hseVerified = true; await saveKey('hse:permits', state.permits); showToast('Vérification HSE confirmée.'); render(); }
      });
    });
  }

  init();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline shell unavailable, app still works online */ });
  });
}
</script>
</body>
</html>
